    "vars": {
      "CMAKE_EXPORT_COMPILE_COMMANDS": "1",
      "KG_CUCS_DIR": "/home/aaramoon/workspace/oss/cucs"
    },
    "hook": {
      "on-activate": "  export LIBCLANG_INCLUDE_DIR=\"$FLOX_ENV/include\"\n  export LIBCLANG_LIBRARY_DIR=\"$FLOX_ENV/lib\"\n  # KG_RESOURCE_DIR must be what clang's own -resource-dir flag expects: the\n  # *parent* of the include/ directory that holds builtin headers like\n  # stddef.h (i.e. exactly what `clang -print-resource-dir` reports), NOT\n  # the include/ directory itself. Passing the include/ dir one level too\n  # deep silently breaks header discovery for any TU that pulls in a system\n  # header (e.g. `#include <string>`) -- found and fixed in Phase 3.\n  for d in \"$FLOX_ENV\"/lib/clang/*; do\n    [ -f \"$d/include/stddef.h\" ] && export KG_RESOURCE_DIR=\"$d\"\n  done\n  if [ -x \"$KG_CUCS_DIR/.pixi/envs/default/bin/nvcc\" ]; then\n    export KG_CUDA_PATH=\"$KG_CUCS_DIR/.pixi/envs/default\"\n  fi\n  export CMAKE_PREFIX_PATH=\"$FLOX_ENV${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}\"\n"
    },
    "profile": {},
    "options": {
      "systems": [
        "x86_64-linux",
        "aarch64-linux"
      ]
    }
  },
